[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonolumen"
version = "0.1.0.dev0"
description = "Single-bubble sonoluminescence and cavitation plasma simulator — implementation of cavitation_research/11_simulator_spec.md"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Thomas Mandolini" },
]
keywords = [
    "sonoluminescence",
    "cavitation",
    "plasma",
    "physics",
    "simulation",
    "bubble-dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/Mando-369/sonolumen"
Repository = "https://github.com/Mando-369/sonolumen"
Issues = "https://github.com/Mando-369/sonolumen/issues"
Changelog = "https://github.com/Mando-369/sonolumen/blob/main/CHANGELOG.md"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
plasma = ["plasmapy>=2024.2"]
chemistry = ["cantera>=3.0"]
config = ["pydantic>=2.6"]
units = ["astropy>=6.0"]
ui = [
    "dash>=2.16",
    "plotly>=5.20",
    "dash-bootstrap-components>=1.5",
    "waitress>=3.0",
]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.2",
]

[tool.setuptools.packages.find]
include = ["sonolumen*"]
exclude = ["tests*", "examples*", "cavitation_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 60
addopts = "-ra"
